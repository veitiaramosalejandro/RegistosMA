services:
  audiortsp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MEDIAMTX_VERSION: "${MEDIAMTX_VERSION:-1.15.2}"
        MEDIAMTX_ARCH: "${MEDIAMTX_ARCH:-amd64}"
    image: audiortsp:linux
    container_name: audiortsp
    restart: unless-stopped
    ports:
      - "${RTSP_PORT:-8554}:${RTSP_PORT:-8554}"
      - "${WEB_PORT:-8080}:8080"
    environment:
      WEB_PORT: "8080"
      RTSP_PORT: "${RTSP_PORT:-8554}"
      PUBLIC_HOST: "${PUBLIC_HOST:-localhost}"
      TEST_TONE: "${TEST_TONE:-true}"
      AUDIO_DEVICE: "${AUDIO_DEVICE:-}"
      AUDIO_CHANNELS: "${AUDIO_CHANNELS:-2}"
      AUDIO_BITRATE: "${AUDIO_BITRATE:-192}"
      RTSP_USERNAME: "${RTSP_USERNAME:-}"
      RTSP_PASSWORD: "${RTSP_PASSWORD:-}"
      AUDIO_AGENT_URL: "${AUDIO_AGENT_URL:-http://host.docker.internal:8090}"
      AUDIO_AGENT_TOKEN: "${AUDIO_AGENT_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audiortsp-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  audiortsp-data:
    name: audiortsp-data
