services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mediamtx
    restart: always
    environment:
      - MTX_RTSPTRANSPORTS=tcp
      - MTX_WEBRTCADDITIONALHOSTS=192.168.x.x
    ports:
      - "8554:8554"       # RTSP
      - "1935:1935"       # RTMP
      - "8888:8888"       # HLS
      - "8889:8889"       # WebRTC (HTTP)
      - "8890:8890/udp"   # SRT
      - "8189:8189/udp"   # WebRTC (ICE/UDP)
      - "8892:8892"       # WebRTC (HTTPS)
      - "8892:8892/udp"   # WebRTC (ICE/UDP)
      - "8893:8893/udp"   # WebRTC (ICE/UDP)
    # Opcional: si quieres poder editar la config
    # volumes:
    #   - ./mediamtx.yml:/mediamtx.yml